name: Repository 4 verification

on:
  push:
    branches: [analysis, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4 / Mathlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: extra/standalone-lean
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: AKO26KnowledgeCollapse

  simulation:
    name: SymPy and numerical reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify static symbolic identities
        run: python sim/verify_static.py
      - name: Recreate static figures
        run: python sim/fig_static.py
      - name: Recreate welfare figures
        run: python sim/welfare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ako-figures
          path: figures/*.pdf
          if-no-files-found: warn

  presentation:
    name: Beamer presentation PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-spanish
      - name: Verify approved manuscript bytes when present
        run: |
          if test -f hand/ai-04.pdf; then
            echo '4fcd54609e40a696467950353b6408fbd9145c35ce5f715253769c992c7407dd  hand/ai-04.pdf' | sha256sum -c -
          else
            echo 'Approved manuscript not yet uploaded; slides will show the explicit placeholder.'
          fi
      - name: Compile slides
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error presentation.tex
      - name: Save compiled presentation
        uses: actions/upload-artifact@v4
        with:
          name: ako-presentation-pdf
          path: presentation.pdf
          if-no-files-found: error

  publish-presentation:
    name: Commit verified Beamer PDF to analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/analysis'
    needs: [lean, simulation, presentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ako-presentation-pdf
          path: .
      - name: Commit PDF only to the source branch
        run: |
          test -s presentation.pdf
          git add presentation.pdf
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(slides): publish verified Beamer PDF [skip ci]'
          git push origin HEAD:analysis
